name: Main Data Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      process_date:
        description: "Processing date (YYYY-MM-DD)"
        required: false

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingestion-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::535942231592:role/GitHub_Actions_Personal
          role-session-name: GitHubActionsOIDCSession
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate AWS identity
        run: aws sts get-caller-identity

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Generate CSV
        env:
          BRASIL_IO_TOKEN: ${{ secrets.BRASIL_IO_TOKEN }}
        run: |
          poetry run python scripts/ingest_csv_to_s3.py

      - name: Upload file to S3
        run: |
          aws s3 cp \
            data/gastos-deputados_cota_parlamentar.csv \
            ${{ secrets.LANDING_BUCKET_INGESTION }}/raw/$(date +%F)/

      - name: Trigger Databricks Job
        run: |
          curl -X POST "${{ secrets.DATABRICKS_WORKSPACE_URL }}/api/2.1/jobs/run-now" \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"job_id\": \"${{ secrets.DATABRICKS_JOB_ID }}\"
            }"
